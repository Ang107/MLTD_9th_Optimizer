<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <noscript>
    <meta http-equiv="refresh" content="5; url=https://ang107.github.io/MLTD_Anniversary_Event_Optimizer_LEGACY_VERSION/">
  </noscript>
  <title>サイトを移転しました</title>
  <style>
    :root {
      font-family: Inter, "Noto Sans JP", "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      color: #233533;
      background: #eef6f4;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 1.5rem;
      display: grid;
      place-items: center;
      background:
        radial-gradient(52rem 24rem at 92% 0%, rgba(90, 191, 183, .18), transparent 70%),
        radial-gradient(42rem 20rem at 3% 100%, rgba(241, 149, 145, .12), transparent 70%),
        #eef6f4;
    }
    main {
      position: relative;
      width: min(100%, 38rem);
      overflow: hidden;
      padding: clamp(2rem, 7vw, 3.25rem);
      border: 1px solid #c9e4e0;
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 1.25rem 3.5rem rgba(35, 53, 51, .12);
      text-align: center;
    }
    main::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: .25rem;
      background: linear-gradient(90deg, #5abfb7, #f19591, #f1becb, #5abfb7);
    }
    h1 {
      margin: 0;
      color: #382a51;
      font-size: clamp(1.65rem, 7vw, 2.25rem);
      line-height: 1.35;
    }
    .lead {
      margin: 1rem 0 0;
      color: #5f716e;
      line-height: 1.8;
    }
    .redirect-status {
      margin: 1.5rem 0;
      padding: .8rem 1rem;
      border: 1px solid #c9e4e0;
      border-radius: .75rem;
      background: #f4fbfa;
      color: #4f6461;
      font-size: .9rem;
    }
    .redirect-status strong {
      color: #2f867f;
      font-variant-numeric: tabular-nums;
    }
    .button {
      display: inline-flex;
      min-height: 3rem;
      padding: .75rem 1.4rem;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      border-radius: .7rem;
      background: linear-gradient(135deg, #3eaaa2, #2f867f);
      box-shadow: 0 .5rem 1.25rem rgba(47, 134, 127, .28);
      color: #fff;
      font-weight: 750;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 .65rem 1.4rem rgba(47, 134, 127, .34);
    }
    .button:focus-visible {
      outline: 3px solid rgba(47, 134, 127, .35);
      outline-offset: 3px;
    }
    .note {
      margin: 1.25rem 0 0;
      color: #71817f;
      font-size: .78rem;
      line-height: 1.65;
    }
    @media (max-width: 30rem) {
      body { padding: 1rem; }
      main { padding: 2rem 1.25rem; }
      .button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="relocation-title">
    <h1 id="relocation-title">サイトを移転しました</h1>
    <p class="lead">MLTD 9th 周年イベント オプティマイザーは<br>新しいURLで公開しています。</p>
    <p class="redirect-status"><strong><span id="countdown">5</span>秒後</strong>に自動で移動します</p>
    <a class="button" id="destination" href="https://ang107.github.io/MLTD_Anniversary_Event_Optimizer_LEGACY_VERSION/">
      新しいサイトへ移動 <span aria-hidden="true">→</span>
    </a>
    <p class="note">今後もご利用になる場合は、移動先をブックマークしてください。</p>
  </main>
  <script>
    (function () {
      "use strict";

      var OLD_BASE = "/MLTD_9th_Optimizer";
      var NEW_BASE = "/MLTD_Anniversary_Event_Optimizer_LEGACY_VERSION";
      var suffix = location.pathname.indexOf(OLD_BASE) === 0
        ? location.pathname.slice(OLD_BASE.length)
        : "/";
      var destination = NEW_BASE + (suffix || "/") + location.search + location.hash;
      var link = document.getElementById("destination");
      var countdown = document.getElementById("countdown");
      var seconds = 5;

      if (new URLSearchParams(location.search).get("preview") === "1") {
        document.querySelector(".redirect-status").textContent = "プレビュー表示中（自動では移動しません）";
        return;
      }

      link.href = destination;
      window.setInterval(function () {
        seconds -= 1;
        countdown.textContent = String(Math.max(seconds, 0));
      }, 1000);
      window.setTimeout(function () {
        location.replace(destination);
      }, 5000);
    }());
  </script>
</body>
</html>
